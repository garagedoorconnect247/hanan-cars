<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>חנן רכבים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="חנן רכבים – רכבים יד שנייה בראשון לציון. מלאי מתעדכן, מחירים הוגנים, שירות אישי. התקשרו 054-494-3630">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&display=swap">
<style>
/* Layout: bright showroom — white lot, deep-blue text, Israeli-plate yellow as the one accent */
:root{
  --bg:#f6f8fb;
  --surface:#ffffff;
  --ink:#14213a;
  --muted:#5b6780;
  --line:#e2e7ef;
  --plate:#f6c400;
  --plate-ink:#1a1a1a;
  --blue:#1d4ed8;
  --wa:#1fa855;
  --display:"Secular One","Assistant",Arial,sans-serif;
  --body:"Assistant",Arial,"Segoe UI",sans-serif;
  --radius:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}

/* Header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-mark{background:var(--plate);color:var(--plate-ink);border:2px solid var(--plate-ink);border-radius:6px;font-family:var(--display);font-size:20px;padding:2px 10px;line-height:1.3}
.logo-text{font-family:var(--display);font-size:22px}
nav.menu{display:flex;gap:4px;margin-inline-start:auto}
nav.menu a{text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted)}
nav.menu a:hover,nav.menu a.on{color:var(--ink);background:var(--bg)}
.top-call{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;white-space:nowrap}
.top-call span{direction:ltr;unicode-bidi:isolate}
@media (max-width:820px){
  nav.menu{display:none}
  .top-call{margin-inline-start:auto}
}

/* Mobile bottom nav */
.mnav{display:none}
@media (max-width:820px){
  .mnav{display:flex;position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));gap:8px}
  .mnav a{flex:1;text-align:center;text-decoration:none;font-weight:700;padding:11px 6px;border-radius:10px}
  body{padding-bottom:76px}
  .float-wa{display:none!important}
}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;text-decoration:none;border-radius:12px;padding:13px 22px;border:2px solid transparent;cursor:pointer}
.btn-call{background:var(--ink);color:#fff}
.btn-wa{background:var(--wa);color:#fff}
.btn-ghost{border-color:var(--line);background:var(--surface)}
.btn svg{width:20px;height:20px;flex:none}

/* Hero */
.hero{background:var(--surface);border-bottom:1px solid var(--line)}
.hero .wrap{padding-block:44px 40px;display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}
.hero h1{font-size:clamp(32px,5vw,52px)}
.hero h1 mark{background:var(--plate);color:var(--plate-ink);padding:0 10px;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero p{color:var(--muted);font-size:19px;max-width:34em;margin:14px 0 22px}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fact{background:var(--bg);border-radius:var(--radius);padding:18px 14px;text-align:center}
.fact b{display:block;font-family:var(--display);font-size:30px;line-height:1.1}
.fact span{color:var(--muted);font-size:15px}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;padding-block:28px}}

/* Section heads */
.sec{padding-block:44px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-head h2{font-size:clamp(26px,3.4vw,34px)}
.sec-head p{margin:4px 0 0;color:var(--muted)}
.sort{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600}
.sort select{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

/* Car grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(20,33,58,.10)}
.card-img{aspect-ratio:4/3;background:#eef2f7;position:relative;overflow:hidden}
.card-img img,.card-img svg{width:100%;height:100%;object-fit:cover}
.card-year{position:absolute;top:10px;right:10px;background:var(--plate);color:var(--plate-ink);border:2px solid var(--plate-ink);border-radius:5px;font-weight:800;font-size:14px;padding:0 8px}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:21px}
.card .short{color:var(--muted);font-size:15px;margin:0}
.specs-line{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.chip{background:var(--bg);border-radius:999px;padding:2px 10px;font-size:14px;font-weight:600;color:var(--muted)}
.price{font-family:var(--display);font-size:24px;margin-top:auto;padding-top:6px;font-variant-numeric:tabular-nums}
.price small{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:600}

/* Services */
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.svc-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.svc-item h3{font-size:21px;margin-bottom:6px}
.svc-item p{margin:0;color:var(--muted)}
.svc-ico{width:44px;height:44px;border-radius:12px;background:var(--plate);display:grid;place-items:center;margin-bottom:12px}
.svc-ico svg{width:24px;height:24px}

/* About / contact */
.split{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.split > *{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px}
.prose p{margin:0 0 14px;max-width:62ch}
.contact-list{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:10px}
.contact-list li{display:flex;gap:10px;align-items:center}
.contact-list b{min-width:70px;color:var(--muted);font-weight:600}
.ltr{direction:ltr;unicode-bidi:isolate}
@media (max-width:820px){.split{grid-template-columns:1fr}}

/* Car page */
.crumbs{padding-block:18px 0;color:var(--muted);font-weight:600}
.crumbs a{text-decoration:none;color:var(--blue)}
.car-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Gallery collage: big photo + two stacked */
.collage{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:8px;margin-top:14px;aspect-ratio:2.6/1;max-width:100%}
.collage button{border:0;padding:0;margin:0;border-radius:var(--radius);overflow:hidden;background:#eef2f7;cursor:zoom-in;position:relative;min-height:0}
.collage button:first-child{grid-row:1 / span 2}
.collage img,.collage svg{width:100%;height:100%;object-fit:cover}
.collage.one{grid-template-columns:1fr;grid-template-rows:1fr;aspect-ratio:16/9}
.collage.one button:first-child{grid-row:auto}
.collage.two{grid-template-rows:1fr}
.collage.two button:first-child{grid-row:auto}
.show-all{position:absolute;bottom:10px;right:10px;background:rgba(20,33,58,.85);color:#fff;font-weight:700;font-size:15px;padding:5px 12px;border-radius:8px}
@media (max-width:700px){
  .collage{grid-template-columns:1fr;grid-template-rows:auto;aspect-ratio:auto}
  .collage button:first-child{grid-row:auto;aspect-ratio:4/3}
  .collage button:not(:first-child){display:none}
  .collage .show-all{display:block}
}
/* Car layout */
.car{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;padding-block:24px 56px;align-items:start}
.car > *{min-width:0}
.car-main{display:grid;gap:22px}
.car-title h1{font-size:clamp(28px,3.6vw,38px)}
.car-title p{margin:2px 0 0;font-size:19px;color:var(--muted)}
.keystats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.keystat{padding:16px 18px;border-inline-start:1px solid var(--line)}
.keystat:first-child{border-inline-start:0}
.keystat span{display:block;color:var(--muted);font-weight:600;font-size:15px}
.keystat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.keystat small{color:var(--muted);font-size:14px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.block h2{font-size:23px;margin-bottom:12px}
.desc p{margin:0;max-width:66ch;white-space:pre-line}
.perks{display:grid;gap:16px}
.perk{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.perk-ico{width:44px;height:44px;border-radius:12px;background:var(--plate);display:grid;place-items:center}
.perk-ico svg{width:22px;height:22px}
.perk b{display:block}
.perk p{margin:0;color:var(--muted)}
.details{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
.details div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.details dt{color:var(--muted);font-weight:600}
.details dd{margin:0;font-weight:700;text-align:end}
@media (max-width:560px){.details{grid-template-columns:1fr}.keystat{padding:12px}.keystat b{font-size:20px}}
.car-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:0 10px 30px rgba(20,33,58,.08)}
.car-price{font-family:var(--display);font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.car-side .btn{width:100%}
.dealer-line{text-align:center;color:var(--muted);font-weight:600;padding-top:6px;border-top:1px solid var(--line)}
@media (max-width:900px){.car{grid-template-columns:1fr}.car-side{position:static;order:-1}}
/* Lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,12,22,.94);display:grid;grid-template-rows:auto 1fr auto;padding:calc(10px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));color:#fff}
.lb-top{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.lb-stage{display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.lb-stage img{max-height:100%;max-width:100%;object-fit:contain;border-radius:8px}
.lb button{font:inherit;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:999px;cursor:pointer}
.lb-close{width:44px;height:44px;font-size:24px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;font-size:26px}
.lb-prev{right:6px}.lb-next{left:6px}

.float-wa{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:calc(20px + env(safe-area-inset-left,0px));z-index:15;width:58px;height:58px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.float-wa svg{width:30px;height:30px}

footer{background:var(--ink);color:#c9d3e6}
footer .wrap{padding-block:28px;display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between}
footer a{color:#fff}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:30px;text-align:center;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#home" aria-label="חנן רכבים – דף הבית">
      <span class="logo-mark">חנן</span><span class="logo-text">רכבים</span>
    </a>
    <nav class="menu" aria-label="תפריט ראשי">
      <a href="#home" data-nav="home">רכבים במלאי</a>
      <a href="#services" data-nav="services">שירותים</a>
      <a href="#about" data-nav="about">אודות</a>
      <a href="#contact" data-nav="contact">צור קשר</a>
    </nav>
    <a class="top-call" id="topCall" href="#">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
      <span id="topPhone"></span>
    </a>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <div><strong id="fName"></strong> · רכבים יד שנייה ב<span id="fCity"></span></div>
    <div>טלפון: <a id="fPhone" class="ltr" href="#"></a></div>
    <div>© <span id="fYear"></span> כל הזכויות שמורות</div>
  </div>
</footer>

<a class="float-wa" id="floatWa" href="#" target="_blank" rel="noopener" aria-label="שלחו הודעת וואטסאפ">
  <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1a8.2 8.2 0 0 1-2.4-1.5 9 9 0 0 1-1.7-2.1c-.2-.3 0-.5.1-.6l.4-.5.3-.5v-.5c-.1-.1-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6a1.1 1.1 0 0 0-.8.4 3.4 3.4 0 0 0-1 2.5 5.9 5.9 0 0 0 1.2 3.1 13.4 13.4 0 0 0 5.2 4.6c.7.3 1.3.5 1.7.6a4.2 4.2 0 0 0 1.9.1 3.1 3.1 0 0 0 2-1.4 2.5 2.5 0 0 0 .2-1.4c-.1-.1-.3-.2-.6-.3zM12 21.8a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4a9.8 9.8 0 1 1 8.3 4.6zm8.4-18.2A11.8 11.8 0 0 0 1.8 17.9L.1 24l6.3-1.6A11.8 11.8 0 0 0 23.8 12a11.7 11.7 0 0 0-3.4-8.4z"/></svg>
</a>

<nav class="mnav" aria-label="פעולות מהירות">
  <a id="mCall" class="btn-call" href="#">התקשרו</a>
  <a id="mWa" class="btn-wa" href="#" target="_blank" rel="noopener">וואטסאפ</a>
</nav>

<script src="cars.js?v=6"></script>
<script>
(function(){
  var B = BUSINESS;
  var tel = "tel:+" + B.phoneIntl;
  function waLink(text){ return "https://wa.me/" + B.phoneIntl + "?text=" + encodeURIComponent(text); }
  function priceText(c){ return c.price ? "₪" + fmt(c.price) : '<span style="font-size:.75em">מחיר בטלפון</span>'; }
  function fmt(n){ return Number(n).toLocaleString("he-IL"); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  var ICON_CALL = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
  var ICON_WA = document.querySelector("#floatWa svg").outerHTML.replace('fill="#fff"','fill="currentColor"');

  // Placeholder drawing for a car with no photos yet
  function placeholder(c){
    return '<svg viewBox="0 0 400 300" role="img" aria-label="תמונה תתווסף בקרוב">' +
      '<rect width="400" height="300" fill="#eef2f7"/>' +
      '<path d="M70 190 q8-46 52-52 l40-34 q14-10 34-10 h56 q22 0 36 16 l30 30 q42 4 50 30 v20 h-298z" fill="#cfd8e6"/>' +
      '<path d="M172 108 h40 v34 h-72z M222 108 h30 q14 0 24 12 l20 22 h-74z" fill="#ffffff" opacity=".8"/>' +
      '<circle cx="128" cy="200" r="26" fill="#14213a"/><circle cx="128" cy="200" r="11" fill="#cfd8e6"/>' +
      '<circle cx="290" cy="200" r="26" fill="#14213a"/><circle cx="290" cy="200" r="11" fill="#cfd8e6"/>' +
      '<rect x="150" y="238" width="100" height="26" rx="4" fill="#f6c400" stroke="#1a1a1a" stroke-width="2"/>' +
      '<text x="200" y="257" text-anchor="middle" font-family="Assistant,Arial" font-weight="800" font-size="15" fill="#1a1a1a">תמונה בקרוב</text>' +
    '</svg>';
  }
  function cover(c){ return c.images && c.images.length ? '<img src="' + esc(c.images[0]) + '" alt="' + esc(c.title) + '" loading="lazy">' : placeholder(c); }

  // Static bits
  document.getElementById("topCall").href = tel;
  document.getElementById("topPhone").textContent = B.phone;
  document.getElementById("mCall").href = tel;
  document.getElementById("mWa").href = waLink("שלום, הגעתי מהאתר של " + B.name);
  document.getElementById("floatWa").href = waLink("שלום, הגעתי מהאתר של " + B.name);
  document.getElementById("fName").textContent = B.name;
  document.getElementById("fCity").textContent = B.city;
  var fp = document.getElementById("fPhone"); fp.textContent = B.phone; fp.href = tel;
  document.getElementById("fYear").textContent = new Date().getFullYear();

  var app = document.getElementById("app");
  var sortMode = "new";

  function sorted(){
    var list = CARS.slice();
    if (sortMode === "low") list.sort(function(a,b){ return (a.price || 1e12) - (b.price || 1e12); });
    else if (sortMode === "high") list.sort(function(a,b){ return (b.price || 0) - (a.price || 0); });
    else if (sortMode === "year") list.sort(function(a,b){ return b.year - a.year; });
    return list;
  }

  function cardHTML(c){
    return '<a class="card" href="#car-' + esc(c.id) + '">' +
      '<div class="card-img">' + cover(c) + '<span class="card-year">' + esc(c.year) + '</span></div>' +
      '<div class="card-body">' +
        '<h3>' + esc(c.title) + '</h3>' +
        '<p class="short">' + esc(c.short) + '</p>' +
        '<div class="specs-line">' +
          '<span class="chip">' + fmt(c.km) + ' ק״מ</span>' +
          '<span class="chip">יד ' + esc(c.hand) + '</span>' +
          '<span class="chip">' + esc(c.gearbox) + '</span>' +
        '</div>' +
        '<div class="price">' + priceText(c) + '</div>' +
      '</div></a>';
  }

  function servicesHTML(){
    var items = [
      ["מכירת רכבים יד שנייה","מבחר רכבים בדוקים ומטופלים, עם מחיר שקוף ושירות אישי.",'<path d="M5 16l1.5-5A2 2 0 0 1 8.4 9.5h7.2a2 2 0 0 1 1.9 1.5L19 16M4 16h16v3H4zM7 19v1.5M17 19v1.5" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>'],
      ["קניית רכבים / טרייד-אין","רוצים להחליף רכב? נעריך את הרכב שלכם ונקזז מהמחיר.",'<path d="M4 8h13l-3-3M20 16H7l3 3" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'],
      ["סיוע במימון","עזרה בהתאמת מסלול מימון ותשלומים שמתאים לכם.",'<path d="M3 7h18v10H3zM3 11h18M7 15h3" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>'],
      ["העברת בעלות וליווי","טיפול בכל הניירת והעברת הבעלות, בלי כאב ראש.",'<path d="M7 3h7l4 4v14H7zM14 3v4h4M10 13l2 2 4-4" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>']
    ];
    return '<div class="svc">' + items.map(function(i){
      return '<div class="svc-item"><div class="svc-ico"><svg viewBox="0 0 24 24" aria-hidden="true">' + i[2] + '</svg></div><h3>' + i[0] + '</h3><p>' + i[1] + '</p></div>';
    }).join("") + '</div>';
  }

  function contactHTML(){
    return '<section class="sec" id="contactSec"><div class="wrap"><div class="split">' +
      '<div class="prose"><h2 style="font-size:clamp(26px,3.4vw,34px);margin-bottom:12px">ראיתם רכב שמעניין אתכם?</h2>' +
        '<p>התקשרו או שלחו הודעה בוואטסאפ. נשמח לתאם נסיעת מבחן, לשלוח תמונות נוספות ולענות על כל שאלה.</p></div>' +
      '<div class="panel"><ul class="contact-list">' +
        '<li><b>טלפון</b><a class="ltr" href="' + tel + '">' + esc(B.phone) + '</a></li>' +
        '<li><b>אזור</b><span>' + esc(B.city) + '</span></li>' +
      '</ul><div class="car-actions">' +
        '<a class="btn btn-call" href="' + tel + '">' + ICON_CALL + 'התקשרו</a>' +
        '<a class="btn btn-wa" target="_blank" rel="noopener" href="' + waLink("שלום, הגעתי מהאתר של " + B.name) + '">' + ICON_WA + 'וואטסאפ</a>' +
      '</div></div>' +
    '</div></div></section>';
  }

  function aboutText(){
    return '<p>' + esc(B.name) + ' הוא מגרש רכבים משפחתי ב' + esc(B.city) + '. אנחנו מאמינים בעסקה פשוטה וישרה: רכבים שמטופלים כמו שצריך, מחיר ברור מראש, ותשובה אמיתית לכל שאלה.</p>' +
      '<p>כל רכב במלאי עובר בדיקה לפני שהוא עולה למכירה, ואתם מוזמנים להביא אותו לבדיקה במכון לפי בחירתכם. אצלנו מדברים ישירות עם חנן, בלי מוקדים ובלי סיבובים.</p>';
  }

  function renderHome(){
    var list = sorted();
    app.innerHTML =
      '<section class="hero"><div class="wrap">' +
        '<div><h1>רכבים יד שנייה <mark>ב' + esc(B.city) + '</mark></h1>' +
          '<p>מלאי רכבים בדוקים במחירים הוגנים. בחרו רכב, התקשרו או שלחו וואטסאפ ונתאם לכם נסיעת מבחן.</p>' +
          '<div class="hero-actions"><a class="btn btn-call" href="' + tel + '">' + ICON_CALL + 'התקשרו עכשיו</a>' +
          '<a class="btn btn-wa" target="_blank" rel="noopener" href="' + waLink("שלום, הגעתי מהאתר של " + B.name) + '">' + ICON_WA + 'שלחו וואטסאפ</a></div></div>' +
        '<div class="facts">' +
          '<div class="fact"><b>' + CARS.length + '</b><span>רכבים במלאי</span></div>' +
          '<div class="fact"><b>✓</b><span>מותר לבדוק במכון</span></div>' +
          '<div class="fact"><b>1:1</b><span>שירות אישי</span></div>' +
        '</div>' +
      '</div></section>' +
      '<section class="sec" id="cars"><div class="wrap">' +
        '<div class="sec-head"><div><h2>הרכבים שלנו</h2><p>לחצו על רכב לפרטים מלאים ותמונות</p></div>' +
          '<label class="sort" for="sortSel">מיון:<select id="sortSel">' +
            '<option value="new">חדשים במלאי</option><option value="low">מחיר: מהנמוך</option><option value="high">מחיר: מהגבוה</option><option value="year">שנתון: מהחדש</option>' +
          '</select></label></div>' +
        (list.length ? '<div class="grid">' + list.map(cardHTML).join("") + '</div>' : '<div class="empty">המלאי מתעדכן. התקשרו לשמוע על רכבים שבדרך.</div>') +
      '</div></section>' +
      '<section class="sec" style="background:var(--surface);border-block:1px solid var(--line)"><div class="wrap">' +
        '<div class="sec-head"><div><h2>מה אנחנו עושים</h2></div><a class="btn btn-ghost" href="#services">כל השירותים</a></div>' +
        servicesHTML() +
      '</div></section>' +
      contactHTML();
    var sel = document.getElementById("sortSel");
    sel.value = sortMode;
    sel.addEventListener("change", function(){ sortMode = sel.value; renderHome(); document.getElementById("cars").scrollIntoView(); });
  }

  function renderCar(id){
    var c = CARS.filter(function(x){ return x.id === id; })[0];
    if (!c){ app.innerHTML = '<div class="wrap sec"><div class="empty">הרכב הזה כבר נמכר או לא נמצא. <a href="#home">לכל הרכבים במלאי</a></div></div>'; return; }
    var imgs = c.images || [];
    var name = c.title + (c.trim ? " " + c.trim : "") + " " + c.year;
    var msg = "שלום, אני מתעניין ב" + name + (c.price ? " (₪" + fmt(c.price) + ")" : "") + " שראיתי באתר";
    var tradeMsg = "שלום, אני מתעניין ב" + name + " ורוצה לברר על טרייד אין לרכב שלי";
    function has(v){ return v !== undefined && v !== null && v !== "" && !(Array.isArray(v) && !v.length); }

    // Gallery
    var gallery;
    if (!imgs.length){
      gallery = '<div class="collage one"><button type="button" tabindex="-1" style="cursor:default">' + placeholder(c) + '</button></div>';
    } else {
      var shown = imgs.slice(0, 3);
      var cls = shown.length === 1 ? " one" : shown.length === 2 ? " two" : "";
      gallery = '<div class="collage' + cls + '">' + shown.map(function(src, i){
        var label = (i === shown.length - 1 && imgs.length > 1) ? '<span class="show-all">הצגת ' + imgs.length + ' תמונות</span>' : '';
        return '<button type="button" data-i="' + i + '" aria-label="פתיחת תמונה ' + (i+1) + '"><img src="' + esc(src) + '" alt="' + esc(c.title) + ' – תמונה ' + (i+1) + '"' + (i ? ' loading="lazy"' : '') + '>' + label + '</button>';
      }).join("") + '</div>';
    }

    // Key stats
    var stats = '<div class="keystats">' +
      '<div class="keystat"><span>שנה</span><b>' + esc(c.year) + '</b>' + (has(c.roadDate) ? '<small>עלייה לכביש ' + esc(c.roadDate) + '</small>' : '') + '</div>' +
      '<div class="keystat"><span>ק״מ</span><b>' + fmt(c.km) + '</b>' + (has(c.kmLastTest) ? '<small>בטסט האחרון ' + fmt(c.kmLastTest) + '</small>' : '') + '</div>' +
      '<div class="keystat"><span>יד</span><b>' + esc(c.hand) + '</b></div>' +
    '</div>';

    // Perks
    var ICO_SHIELD = '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linejoin="round"/>';
    var ICO_WRENCH = '<path d="M14.5 6.5a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3l7.5-7.5a4 4 0 0 0-2-2z" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linejoin="round"/>';
    var ICO_CARD = '<path d="M3 6h18v12H3zM3 10h18" stroke="#1a1a1a" stroke-width="2" fill="none"/>';
    var perks = [];
    if (has(c.warranty)) perks.push(["אחריות", c.warranty, ICO_SHIELD]);
    if (has(c.treatments)) perks.push(["טיפולים", c.treatments.join(" · "), ICO_WRENCH]);
    if (has(c.services)) perks.push(["שירות", c.services.join(" · "), ICO_CARD]);
    var perksHTML = perks.length ? '<section class="block"><h2>הטבות מיוחדות</h2><div class="perks">' + perks.map(function(p){
      return '<div class="perk"><div class="perk-ico"><svg viewBox="0 0 24 24" aria-hidden="true">' + p[2] + '</svg></div><div><b>' + p[0] + '</b><p>' + esc(p[1]) + '</p></div></div>';
    }).join("") + '</div></section>' : '';

    // Details
    var rows = [["טסט עד",c.test],["תאריך טסט אחרון",c.lastTest],["צבע",c.color],["בעלות מקורית",c.ownership],["תיבת הילוכים",c.gearbox],["סוג מנוע",c.fuel],["מרכב",c.body],["מושבים",c.seats],["כוח סוס",c.hp],["נפח מנוע",c.engine],["צריכת דלק משולבת",c.consumption],["קיבולת סוללה (קוט״ש)",c.battery],["שינויים מהדגם המקורי",c.changes]]
      .filter(function(r){ return has(r[1]); });
    var detailsHTML = rows.length ? '<section class="block"><h2>פרטים נוספים</h2><dl class="details">' + rows.map(function(r){ return '<div><dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd></div>'; }).join("") + '</dl></section>' : '';

    app.innerHTML =
      '<div class="wrap"><div class="crumbs"><a href="#home">רכבים במלאי</a> › ' + esc(c.title) + '</div>' +
      gallery +
      '<div class="car">' +
        '<div class="car-main">' +
          '<div class="car-title"><h1>' + esc(c.title) + '</h1>' + (has(c.trim) ? '<p>' + esc(c.trim) + '</p>' : '') + '</div>' +
          stats +
          (has(c.description) ? '<section class="block desc"><h2>על הרכב</h2><p>' + esc(c.description) + '</p></section>' : '') +
          perksHTML + detailsHTML +
        '</div>' +
        '<aside class="car-side">' +
          '<div class="car-price">' + priceText(c) + '</div>' +
          '<a class="btn btn-wa" target="_blank" rel="noopener" href="' + waLink(msg) + '">' + ICON_WA + 'יצירת קשר בוואטסאפ</a>' +
          '<a class="btn btn-call" href="' + tel + '">' + ICON_CALL + '<span>התקשרו <span class="ltr">' + esc(B.phone) + '</span></span></a>' +
          '<a class="btn btn-ghost" target="_blank" rel="noopener" href="' + waLink(tradeMsg) + '">טרייד אין</a>' +
          '<div class="dealer-line">' + esc(B.name) + ' · ' + esc(B.city) + '</div>' +
        '</aside>' +
      '</div></div>';
    document.getElementById("mWa").href = waLink(msg);
    document.title = c.title + " " + c.year + " | " + B.name;

    app.querySelectorAll(".collage button[data-i]").forEach(function(b){
      b.addEventListener("click", function(){ openLightbox(imgs, +b.dataset.i, c.title); });
    });
  }

  function openLightbox(imgs, start, title){
    var i = start;
    var lb = document.createElement("div");
    lb.className = "lb"; lb.setAttribute("role","dialog"); lb.setAttribute("aria-modal","true"); lb.setAttribute("aria-label","תמונות " + title);
    lb.innerHTML = '<div class="lb-top"><span class="lb-count"></span><button type="button" class="lb-close" aria-label="סגירה">×</button></div>' +
      '<div class="lb-stage"><img alt=""><button type="button" class="lb-nav lb-prev" aria-label="התמונה הקודמת">›</button><button type="button" class="lb-nav lb-next" aria-label="התמונה הבאה">‹</button></div><div></div>';
    document.body.appendChild(lb);
    document.body.style.overflow = "hidden";
    var img = lb.querySelector("img"), count = lb.querySelector(".lb-count");
    function show(){ img.src = imgs[i]; img.alt = title + " – תמונה " + (i+1); count.textContent = (i+1) + " / " + imgs.length; }
    function go(d){ i = (i + d + imgs.length) % imgs.length; show(); }
    function close(){ document.removeEventListener("keydown", key); lb.remove(); document.body.style.overflow = ""; }
    function key(e){ if (e.key === "Escape") close(); else if (e.key === "ArrowLeft") go(1); else if (e.key === "ArrowRight") go(-1); }
    lb.querySelector(".lb-close").onclick = close;
    lb.querySelector(".lb-prev").onclick = function(){ go(-1); };
    lb.querySelector(".lb-next").onclick = function(){ go(1); };
    lb.addEventListener("click", function(e){ if (e.target === lb || e.target.classList.contains("lb-stage")) close(); });
    var sx = null;
    lb.addEventListener("touchstart", function(e){ sx = e.touches[0].clientX; }, {passive:true});
    lb.addEventListener("touchend", function(e){ if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) go(dx > 0 ? 1 : -1); sx = null; });
    document.addEventListener("keydown", key);
    if (imgs.length < 2) lb.querySelectorAll(".lb-nav").forEach(function(b){ b.hidden = true; });
    show();
    lb.querySelector(".lb-close").focus();
  }

  function renderServices(){
    app.innerHTML = '<section class="sec"><div class="wrap"><div class="sec-head"><div><h2>השירותים שלנו</h2><p>הכול במקום אחד, מהבחירה ועד העברת הבעלות</p></div></div>' + servicesHTML() + '</div></section>' + contactHTML();
  }
  function renderAbout(){
    app.innerHTML = '<section class="sec"><div class="wrap"><div class="split"><div class="prose"><h2 style="font-size:clamp(26px,3.4vw,34px);margin-bottom:14px">אודות ' + esc(B.name) + '</h2>' + aboutText() + '</div>' +
      '<div class="panel"><div class="facts"><div class="fact"><b>' + CARS.length + '</b><span>רכבים במלאי</span></div><div class="fact"><b>✓</b><span>בדיקה במכון</span></div><div class="fact"><b>1:1</b><span>שירות אישי</span></div></div></div>' +
      '</div></div></section>' + contactHTML();
  }

  function route(){
    var h = (location.hash || "#home").slice(1);
    document.getElementById("mWa").href = waLink("שלום, הגעתי מהאתר של " + B.name);
    var nav = h.indexOf("car-") === 0 ? "home" : h;
    document.querySelectorAll("[data-nav]").forEach(function(a){ a.classList.toggle("on", a.dataset.nav === nav); });
    if (h.indexOf("car-") === 0){ renderCar(h.slice(4)); window.scrollTo(0,0); return; }
    document.title = B.name;
    if (h === "services") renderServices();
    else if (h === "about") renderAbout();
    else if (h === "contact"){ renderHome(); document.getElementById("contactSec").scrollIntoView(); return; }
    else renderHome();
    if (h !== "cars") window.scrollTo(0,0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
